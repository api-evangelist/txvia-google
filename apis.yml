name: TxVia (Google)
description: 'TxVia was a New York-based payments technology company that provided
  an issuer-processing platform for prepaid and other emerging payment card programs,
  reported at the time of its exit to power programs covering roughly 100 million
  accounts. Backed by Bain Capital Ventures, TxVia was acquired by Google on April
  2, 2012 and its technology and team were folded into Google Wallet (now Google
  Pay). The company no longer operates independently: txvia.com today serves a
  Google-hosted acquisition notice, and there is no public developer program, API
  surface, GitHub organization, or published packages. This profile is retained
  as an acquired-company lead in the API Evangelist network.'
